<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avocato Movies - Discover Amazing Films</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="./styles/styles.css">
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation" id="bgAnimation"></div>

    <header>
        <div class="header-content">
            <div class="logo">
                <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo" onerror="this.style.display='none'">
                <span class="logo-text">Avocato Movies</span>
            </div>
            <nav>
                <a href="#" onclick="scrollToMovies()">Browse</a>
                <a href="#">Top Rated</a>
                <a href="#">New Releases</a>
            </nav>
        </div>
    </header>

    <div class="hero">
        <h1>Discover Amazing Movies</h1>
        <p>Explore our curated collection of films with ratings from our community</p>
        <div class="search-container">
            <input type="text" class="search-input" placeholder="Search for movies..." id="searchInput">
        </div>
    </div>

    <div class="container">
        <section>
            <h2 class="section-title" id="moviesSection">Featured Movies</h2>
            <div class="movie-grid" id="movieGrid">
                <!-- Sample movies for demo - replace with your Flask template -->
                <div class="movie-tile">
                    <a href="#">
                        <div class="movie-poster-container">
                            <img src="https://images.unsplash.com/photo-1489599388179-0b0c4b5d1d9d?w=300&h=450&fit=crop" alt="Movie 1">
                            <div class="movie-overlay"></div>
                            <div class="rating-badge">8.5</div>
                        </div>
                        <div class="movie-info">
                            <h4>The Epic Adventure</h4>
                        </div>
                    </a>
                </div>
                
                <div class="movie-tile">
                    <a href="#">
                        <div class="movie-poster-container">
                            <img src="https://images.unsplash.com/photo-1509347528160-9a9e33742cdb?w=300&h=450&fit=crop" alt="Movie 2">
                            <div class="movie-overlay"></div>
                            <div class="rating-badge">9.2</div>
                        </div>
                        <div class="movie-info">
                            <h4>Midnight Mystery</h4>
                        </div>
                    </a>
                </div>

                <div class="movie-tile">
                    <a href="#">
                        <div class="movie-poster-container">
                            <img src="https://images.unsplash.com/photo-1440404653325-ab127d49abc1?w=300&h=450&fit=crop" alt="Movie 3">
                            <div class="movie-overlay"></div>
                            <div class="rating-badge">7.8</div>
                        </div>
                        <div class="movie-info">
                            <h4>Space Odyssey</h4>
                        </div>
                    </a>
                </div>

                <div class="movie-tile">
                    <a href="#">
                        <div class="movie-poster-container">
                            <img src="https://images.unsplash.com/photo-1518709268805-4e9042af2176?w=300&h=450&fit=crop" alt="Movie 4">
                            <div class="movie-overlay"></div>
                            <div class="rating-badge">8.9</div>
                        </div>
                        <div class="movie-info">
                            <h4>Urban Romance</h4>
                        </div>
                    </a>
                </div>
            </div>
        </section>
    </div>
    <script type="module" src="./static/js/particles.js" defer></script>
    <script type="module" src="./static/js/search.js" defer></script>
    <script>

        // Smooth scroll to movies section
        function scrollToMovies() {
            document.getElementById('moviesSection').scrollIntoView({
                behavior: 'smooth'
            });
        }

        // Header scroll effect
        function setupScrollEffects() {
            const header = document.querySelector('header');
            
            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    header.style.background = 'rgba(10, 10, 10, 0.95)';
                } else {
                    header.style.background = 'rgba(26, 26, 26, 0.95)';
                }
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            createParticles();
            setupSearch();
            setupScrollEffects();
        });

        // Add CSS for fade-in animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(20px); }
                to { opacity: 1; transform: translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
